<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login-style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-page-wrapper"> <div class="login-container">
            <div class="login-left">
                
            </div>
            <div class="login-right">
                <div class="login-form-wrapper">
                    <img th:src="@{/img/logo.png}" alt="Kronos Logo" class="login-logo">
                    <h2>Acceder a tu Cuenta</h2>

                    <div th:if="${param.error}" class="alert error">
                        <i class="fas fa-exclamation-circle"></i> Usuario o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert success">
                        <i class="fas fa-check-circle"></i> Has cerrado sesión exitosamente.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="input-group">
                            <label for="username">Usuario (Email)</label>
                            <div class="input-icon-container">
                                <i class="fas fa-user icon"></i> <input type="text" id="username" name="username" placeholder="tu@email.com" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <div class="input-icon-container">
                                <i class="fas fa-lock icon"></i> <input type="password" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-login">
                            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                        </button>
                    </form>
                    <p class="register-link">¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
