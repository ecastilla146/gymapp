# Nombre de la aplicación
spring.application.name=gymapp

# Configuración de la Base de Datos MySQL
# Añadir parámetros de conexión importantes para MySQL Connector/J
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gymdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
# ESENCIAL: Especifica el driver correcto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA (Hibernate)
spring.thymeleaf.cache=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Puerto del servidor web
server.port=8080
# Habilitar logging detallado para Thymeleaf
logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.web.servlet.view.thymeleaf=DEBUG